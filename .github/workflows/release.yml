name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04     # oldest glibc for widest Linux compatibility
            script: ./packaging/build.sh
            artifact: linux
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File packaging/build.ps1
            artifact: windows
          - os: macos-14          # Apple Silicon; the .dmg is unsigned (see README-macOS.txt inside)
            script: ./packaging/build.sh
            artifact: macos
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: bash
        run: ${{ matrix.script }}
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.dmg
            dist/*.dmg.sha256

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [wheel, binaries]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          path: artifacts
          pattern: "{wheel,binaries-*}"
          merge-multiple: true
      - name: Retry artifact download
        if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{wheel,binaries-*}"
          merge-multiple: true
      - run: ls -la artifacts
      - name: Extract release notes
        run: |
          python - <<'PY'
          import re, pathlib
          tag = "${{ github.ref_name }}".lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(rf"## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)", text, re.S)
          pathlib.Path("notes.md").write_text(m.group(1).strip() if m else f"Release {tag}")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: artifacts/*
          generate_release_notes: true
